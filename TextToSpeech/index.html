<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text To Speech</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body
    class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-700 text-white font-sans min-h-screen flex items-center justify-center">
    <div class="flex flex-col items-center w-full max-w-2xl p-8 bg-gray-900 bg-opacity-80 rounded-lg shadow-lg">
        <h1 id="heading" class="mb-8 text-4xl font-bold tracking-wide text-center text-teal-400 drop-shadow-lg">
            Text to Voice Converter
        </h1>
        <div class="w-full space-y-4">
            <textarea id="text" placeholder="Type your text here"
                class="w-full p-3 text-gray-900 text-lg rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-teal-500 resize-none"
                rows="4">
            </textarea>

            <div class="flex flex-col items-start">
                <label for="voiceSelect" class="text-sm font-semibold text-teal-300 mb-1">
                    Select Voice
                </label>
                <select id="voiceSelect"
                    class="w-full p-2 text-gray-900 rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white">
                    <option>
                        Select Voice
                    </option>
                </select>
            </div>

            <div class="flex flex-col items-start">
                <label for="rate" class="text-sm font-semibold text-teal-300 mb-1">Rate</label>
                <input type="number" id="rate" min="0.1" max="10" step="0.1" value="1"
                    class="w-full p-2 text-gray-900 rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white">
            </div>

            <div class="flex flex-col items-start">
                <label for="pitch" class="text-sm font-semibold text-teal-300 mb-1">Pitch</label>
                <input type="number" id="pitch" min="0" max="2" step="0.1" value="1"
                    class="w-full p-2 text-gray-900 rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white">
            </div>

            <div class="flex flex-col items-start">
                <label for="volume" class="text-sm font-semibold text-teal-300 mb-1">Volume</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1"
                    class="w-full h-2 bg-teal-500 rounded-lg appearance-none focus:outline-none">
            </div>

            <div class="flex space-x-4 mt-6">
                <button id="speak"
                    class="w-1/2 p-3 text-lg font-semibold rounded-lg bg-teal-500 text-gray-900 hover:bg-teal-400 transition focus:outline-none focus:ring-2 focus:ring-teal-400 shadow-md">
                    SPEAK
                </button>
                <button id="reset"
                    class="w-1/2 p-3 text-lg font-semibold rounded-lg bg-gray-700 text-teal-400 hover:bg-gray-600 transition focus:outline-none focus:ring-2 focus:ring-teal-400 shadow-md">
                    RESET
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
